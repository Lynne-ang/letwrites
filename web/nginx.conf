# Letwrites marketing site — static files on Cloud Run (listens on 8080).
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # gzip text assets
    gzip            on;
    gzip_types      text/css text/plain application/javascript image/svg+xml;
    gzip_min_length 512;

    # Clean URLs: /terms and /terms.html both resolve to terms.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Long-cache immutable static assets (icons/logos)
    location ~* \.(png|ico|svg|jpg|jpeg|gif|webp|woff2?)$ {
        expires    7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Always revalidate HTML so redesign changes show up immediately
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    error_page 404 /index.html;
}
