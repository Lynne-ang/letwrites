name: publish-images

# Build and publish the pinnable Letwrites images to GHCR so anyone can run the
# stack on any environment (VM, K8s, private cluster) without building from source.
#
# Triggers on a version tag (e.g. v0.1.0) or manual dispatch. Images land at:
#   ghcr.io/lynne-ang/letwrites-engine:<tag>
#   ghcr.io/lynne-ang/letwrites-migrate:<tag>
#   ghcr.io/lynne-ang/letwrites-bookstack:<tag>
# tagged with the version AND :latest.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.1.0)"
        required: true
        default: "dev"

env:
  REGISTRY: ghcr.io
  OWNER: lynne-ang   # GHCR requires a lowercase owner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: letwrites-engine
            context: engine
            file: engine/Dockerfile
          - name: letwrites-migrate
            context: exporter
            file: exporter/Dockerfile
          - name: letwrites-bookstack
            context: wiki
            file: wiki/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        env:
          # Pass untrusted inputs through env — never interpolate ${{ }} into a run: shell.
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "value=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${INPUT_TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
