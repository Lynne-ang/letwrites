apiVersion: v1
kind: Service
metadata:
  name: {{ include "letwrites.fullname" . }}-db
  labels: {{- include "letwrites.labels" . | nindent 4 }}
spec:
  clusterIP: None   # headless, for the StatefulSet
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    letwrites.component: db
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "letwrites.fullname" . }}-db
  labels: {{- include "letwrites.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "letwrites.fullname" . }}-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      letwrites.component: db
  template:
    metadata:
      labels:
        {{- include "letwrites.labels" . | nindent 8 }}
        letwrites.component: db
    spec:
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image | quote }}
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]  # full unicode + emoji
          env:
            - name: TZ
              value: {{ .Values.bookstack.tz | quote }}
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.mariadb.user | quote }}
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "letwrites.secretName" . }}, key: DB_PASSWORD } }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "letwrites.secretName" . }}, key: DB_ROOT_PASSWORD } }
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.mariadb.storageClass }}
        storageClassName: {{ .Values.mariadb.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mariadb.storage | quote }}
