{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "letwrites.fullname" . }}
  labels: {{- include "letwrites.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.domain | quote }}]
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.domain | quote }}
      http:
        paths:
          # ONLY the wiki is exposed. The engine has no Ingress path — it's internal,
          # reached by the future MCP gateway, never the public internet.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "letwrites.fullname" . }}-bookstack
                port:
                  number: 80
{{- end }}
