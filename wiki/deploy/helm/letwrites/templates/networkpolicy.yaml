{{- if .Values.networkPolicy.enabled }}
# Restrict who can reach the engine and the database to pods in THIS release.
# Egress is left open so SSO/SMTP/S3/DNS keep working. BookStack has no policy, so the
# Ingress controller can still reach it. Only effective on a CNI that enforces NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "letwrites.fullname" . }}-engine
  labels: {{- include "letwrites.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      letwrites.component: engine
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - { port: 8787, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "letwrites.fullname" . }}-db
  labels: {{- include "letwrites.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      letwrites.component: db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - { port: 3306, protocol: TCP }
{{- end }}
