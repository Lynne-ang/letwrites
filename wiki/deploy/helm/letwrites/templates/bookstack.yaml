apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "letwrites.fullname" . }}-bookstack
  labels: {{- include "letwrites.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.bookstack.storageClass }}
  storageClassName: {{ .Values.bookstack.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.bookstack.storage | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "letwrites.fullname" . }}-bookstack
  labels: {{- include "letwrites.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    letwrites.component: bookstack
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "letwrites.fullname" . }}-bookstack
  labels: {{- include "letwrites.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.bookstack.replicas }}
  strategy:
    type: Recreate   # single RWO volume — never two pods writing at once
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      letwrites.component: bookstack
  template:
    metadata:
      labels:
        {{- include "letwrites.labels" . | nindent 8 }}
        letwrites.component: bookstack
    spec:
      containers:
        - name: bookstack
          image: {{ include "letwrites.bookstackImage" . | quote }}
          env:
            - name: PUID
              value: {{ .Values.bookstack.puid | quote }}
            - name: PGID
              value: {{ .Values.bookstack.pgid | quote }}
            - name: TZ
              value: {{ .Values.bookstack.tz | quote }}
            - name: APP_URL
              value: "https://{{ .Values.domain }}"
            - name: APP_NAME
              value: "Letwrites"
            - name: APP_THEME
              value: "letwrites"
            - name: REGISTRATION_ENABLED
              value: {{ .Values.bookstack.registrationEnabled | quote }}
            - name: DB_HOST
              value: {{ include "letwrites.fullname" . }}-db
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: {{ .Values.mariadb.database | quote }}
            - name: DB_USERNAME
              value: {{ .Values.mariadb.user | quote }}
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "letwrites.secretName" . }}, key: DB_PASSWORD } }
            - name: APP_KEY
              valueFrom: { secretKeyRef: { name: {{ include "letwrites.secretName" . }}, key: APP_KEY } }
            - name: LETWRITES_AUTHZ_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "letwrites.secretName" . }}, key: LETWRITES_AUTHZ_SECRET } }
            {{- with .Values.bookstack.extraEnv }}
            # SSO and anything else: AUTH_METHOD + LDAP_*/SAML2_*/OIDC_*, MAIL_*, etc.
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 80
          startupProbe:
            httpGet: { path: /login, port: 80 }
            periodSeconds: 10
            failureThreshold: 30   # first boot runs DB migrations — allow up to 5 min
          readinessProbe:
            httpGet: { path: /login, port: 80 }
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "letwrites.fullname" . }}-bookstack
