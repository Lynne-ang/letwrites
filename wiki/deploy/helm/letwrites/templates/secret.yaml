{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "letwrites.fullname" . }}-secrets
  labels: {{- include "letwrites.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_KEY: {{ required "secrets.appKey is required (or set secrets.existingSecret)" .Values.secrets.appKey | quote }}
  DB_PASSWORD: {{ required "secrets.dbPassword is required" .Values.secrets.dbPassword | quote }}
  DB_ROOT_PASSWORD: {{ required "secrets.dbRootPassword is required" .Values.secrets.dbRootPassword | quote }}
  LETWRITES_AUTHZ_SECRET: {{ required "secrets.authzSecret is required" .Values.secrets.authzSecret | quote }}
  LETWRITES_ENGINE_SECRET: {{ required "secrets.engineSecret is required" .Values.secrets.engineSecret | quote }}
  BOOKSTACK_TOKEN_ID: {{ .Values.secrets.bookstackTokenId | quote }}
  BOOKSTACK_TOKEN_SECRET: {{ .Values.secrets.bookstackTokenSecret | quote }}
{{- end }}
